<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101517" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{description}">

    <link rel="canonical" href="{canonical_url}">

    <!-- Rich Previews -->
    <meta property="og:site_name" content="Sam Burkhard">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="{og_type}">
    <meta property="og:title" content="{og_title}">
    <meta property="og:description" content="{description}">
    <meta property="og:image" content="{og_image}">
    <meta property="og:image:alt" content="Sam Burkhard">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="{canonical_url}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{og_title}">
    <meta name="twitter:description" content="{description}">
    <meta name="twitter:image" content="{og_image}">
    <meta name="twitter:image:alt" content="Sam Burkhard">

    <link rel="stylesheet" href="/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    </noscript>

    <link rel="me" href="https://mastodon.social/@samburkhard">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="alternate" title="Posts" type="application/rss+xml" href="/feed.xml">
    <title>{document_title}</title>
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="layout">
        <aside class="sidebar">
            <div class="row sidebar-header">
                <h1 id="wordmark"><a href="/">⬥ Sam Burkhard</a></h1>
            </div>
            <nav class="social" aria-label="Social">
                <a href="https://github.com/srburk" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/sam-burkhard-712734223/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://x.com/samrburkhard" target="_blank" rel="noopener noreferrer">X</a>
                <a href="mailto:burkhas4@mail.uc.edu">Email</a>
            </nav>
        </aside>

        <main id="content">
            {content}

            <footer>
                <p>© {copyright_date} Sam Burkhard</p>
            </footer>
        </main>
    </div>
</body>
</html>
